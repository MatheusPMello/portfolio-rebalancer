name: CI Pipeline (Build & Test)

# 1. TRIGGER:
# It runs on every push to the 'main' branch and every Pull Request.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# 2. JOBS:
jobs:
  test-server:
    name: Server - Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Server Dependencies
        run: cd server && npm ci --ignore-scripts

      - name: Lint Server Code
        run: cd server && npm run lint

      - name: Run Unit Tests
        run: npm test

  # --- JOB B: FRONTEND (Client) ---
  build-client:
    name: Client - Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: cd client && npm ci --ignore-scripts

      - name: Lint Client Code
        run: cd client && npm run lint

      - name: Run Client Unit Tests
        run: cd client && npm test

      - name: Build React App
        run: cd client && npm run build

  # --- JOB C: SONARCLOUD SCAN & REPORT ---
  sonarcloud:
    name: SonarCloud Analysis & Report
    runs-on: ubuntu-latest
    needs: [test-server, build-client]

    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for SonarCloud analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Server Dependencies
        run: cd server && npm ci --ignore-scripts

      - name: Generate Test Coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarCloud Background Processing
        run: sleep 15

      - name: Fetch SonarCloud Report via API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/fetch-sonar-report.mjs

      - name: Upload SonarCloud Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: reports/
