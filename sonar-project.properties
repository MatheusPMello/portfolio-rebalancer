# SonarCloud Project Configuration
# If your keys differ on sonarcloud.io, update them here:
sonar.projectKey=MatheusPMello_portfolio-rebalancer
sonar.organization=matheuspmello
sonar.projectName=portfolio-rebalancer

# Source code directories
sonar.sources=server/src,client/src

# Test directories and patterns
sonar.tests=server/src,client/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,reports/**,scripts/**,build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Code Coverage (generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=client/src/**,server/src/config/setupDatabase.ts,server/src/server.ts,**/*.test.ts,**/*.test.tsx

# Source encoding
sonar.sourceEncoding=UTF-8
